<body>
    <div class="componente-global">
        <img src="/zenith_icon_app_mini.png" alt="zenith-logo" class="icono-mini" />
        <h1>Zenith</h1>
        <h2>Habit Tracker</h2>
        <div class="auth-card">
            <div class="tabs-auth">
                <button [class.activo]="pestanaActiva === 'login'" (click)="cambiarPestana('login')">
                    Iniciar Sesión</button>
                <button [class.activo]="pestanaActiva === 'registro'" (click)="cambiarPestana('registro')">
                    Registrarse</button>
            </div>
            @if (pestanaActiva === 'login') {
            <div class="form-login">
                <p>Correo/Usuario/Telefono</p>
                <input class="inputs-texto" type="text">
                <p>Contraseña</p>
                <input class="inputs-texto" type="password">
                <a>¿Olvidaste tu contraseña?</a>
                <button class="boton-principal" routerLink="/dashboard">Iniciar Sesión</button>
            </div>
            }
            @else {
            <div class="form-registro">
                <p>Nombre</p>
                <input class="inputs-texto" type="text">
                <p>Primer Apellido</p>
                <input class="inputs-texto" type="text">
                <p>Segundo Apellido</p>
                <input class="inputs-texto" type="text">
                <p>Nombre de Usuario</p>
                <input class="inputs-texto" type="text">
                <p>Correo</p>
                <input class="inputs-texto" type="text">
                <p>Telefono</p>
                <input class="inputs-texto" type="text">
                <p>Contraseña</p>
                <input class="inputs-texto" type="password">
                <p>Confirmar contraseña</p>
                <input class="inputs-texto" type="password">
                <button class="boton-principal">Registrarse</button>
            </div>
            }
        </div>
    </div>
</body>
