<header class="header">
    <div class="header-izquierda">
        <button class="boton-hamburguesa" (click)="alternarSidebar()" aria-label="Abrir menú">
            <i class="bi bi-list"></i>
        </button>
        <img class="logo-mini" src="zenith_icon_app_mini.png" alt="Zenith">
        <span class="nombre-app">Zenith</span>
    </div>
    <a class="boton-perfil" routerLink="/perfil" aria-label="Mi perfil">
        <img [src]="fotoPerfil()" alt="Perfil">
    </a>
</header>
